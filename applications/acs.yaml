---
# ArgoCD Application for Red Hat Advanced Cluster Security (in-repo)
#
# Installs the RHACS operator, Central (stackrox namespace) and the local
# SecuredCluster, demo-sized. See cluster-configs/acs/README.md.
#
# PREREQUISITE for the SecuredCluster: a cluster registration secret (CRS)
# generated by Central and applied manually to the stackrox namespace (it
# contains secrets, so it is not in Git).
#
# No resources-finalizer: deleting this Application must not delete Central
# (and its database) or uninstall ACS.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acs
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ultraJeff/openshift-bootstrap-gitops.git
    targetRevision: main
    path: cluster-configs/acs
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
