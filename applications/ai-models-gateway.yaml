---
# ArgoCD Application for the AI models north-south gateway
#
# Deploys resources/rhoai/gateway from ossm-3-demo: the
# istio-ingress/ai-models-gateway Gateway, the ReferenceGrant that lets it
# read istio-system/mesh-gateway-tls, the HTTPRoutes for iris-onnx and
# phi4-mesh, the passthrough OpenShift Routes, and the RHCL AuthPolicy,
# RateLimitPolicy, and Authorino TLS EnvoyFilter for iris-onnx.
#
# Also owns the gateway TLS Certificate. The issuing mesh CA comes from the
# service-mesh app (ossm-3-demo deploy/base/mesh/mesh-ca.yaml).
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-models-gateway
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ultraJeff/ossm-3-demo.git
    targetRevision: main
    path: resources/rhoai/gateway
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
