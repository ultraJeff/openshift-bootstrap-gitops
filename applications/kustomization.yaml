apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: argocd-applications

resources:
  # Platform infrastructure (in-repo)
  - storage.yaml
  - security.yaml
  - registry.yaml
  - node-configs.yaml
  - descheduler.yaml
  - maintenance.yaml
  - metallb.yaml
  - tekton.yaml
  - devspaces.yaml
  - serverless.yaml

  # Applications with manual secret prerequisites (in-repo)
  - developer-hub.yaml

  # External repos
  - observability.yaml
  - network-observability.yaml
  - external-secrets.yaml
  - rhoai.yaml
  - service-mesh.yaml
  - keda.yaml
  - mta.yaml
