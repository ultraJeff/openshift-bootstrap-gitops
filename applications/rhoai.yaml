---
# ArgoCD Application for Red Hat OpenShift AI (in-repo)
#
# Installs the RHOAI operator plus the DSCInitialization and DataScienceCluster.
# Current footprint is KServe-only (dashboard/workbenches/llamastack Removed);
# see cluster-configs/rhoai/dsc.yaml. Model workloads live elsewhere
# (ossm-3-demo / infrastructure/maintenance/model-serve.sh).
#
# Previously pointed at github.com/ultraJeff/rhoai-super-slim (standalone demo
# repo, kept as-is).
#
# No resources-finalizer: deleting this Application must not cascade-delete the
# operator Subscription and DSC (which would uninstall RHOAI).
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ultraJeff/openshift-bootstrap-gitops.git
    targetRevision: main
    path: cluster-configs/rhoai
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
