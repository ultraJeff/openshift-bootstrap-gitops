---
# Demo-sized Central for the 3-node tallgeese lab (ACS 5.0).
# CPU *requests* are the constraint on this cluster, not usage, so requests are
# kept well below the documented defaults (Central 1.5 / Central DB 4 / StackRox
# Scanner 3 / Scanner V4 6.5 cores). Total Central-side requests here: ~2.6 CPU.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  central:
    exposure:
      route:
        enabled: true
    resources:
      requests:
        cpu: "500m"       # default 1.5
        memory: "2Gi"     # default 4Gi
      limits:
        cpu: "2"
        memory: "4Gi"
    # Central DB (PostgreSQL). Note: spec.central.persistence is an unused
    # legacy field since 4.6; storage is configured here under db.
    db:
      resources:
        requests:
          cpu: "500m"     # default 4 cores
          memory: "2Gi"   # default 8Gi
        limits:
          cpu: "2"
          memory: "4Gi"
      persistence:
        persistentVolumeClaim:
          claimName: central-db
          size: "100Gi"   # thin-provisioned LVM
  scanner:
    # StackRox Scanner: deprecated but still required on the Central cluster.
    analyzer:
      resources:
        requests:
          cpu: "200m"     # default 1 per replica (3 replicas)
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      scaling:
        autoScaling: "Disabled"
        replicas: 1
    scannerComponent: "Enabled"
  # Scanner V4 is the image scanner in 5.0 (the 5.0 operator deployed no
  # StackRox Scanner pods with V4 disabled), so run it demo-sized: one indexer,
  # one matcher (default 3 + 2 replicas, ~6.5 cores of requests in total).
  scannerV4:
    scannerComponent: "Enabled"
    indexer:
      resources:
        requests:
          cpu: "300m"
          memory: "1500Mi"
        limits:
          cpu: "2"
          memory: "3Gi"
      scaling:
        autoScaling: "Disabled"
        replicas: 1
    matcher:
      resources:
        requests:
          cpu: "300m"
          memory: "3Gi"   # holds the vulnerability DB in memory
        limits:
          cpu: "2"
          memory: "6Gi"
      scaling:
        autoScaling: "Disabled"
        replicas: 1
    db:
      resources:
        requests:
          cpu: "300m"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
          size: "50Gi"
