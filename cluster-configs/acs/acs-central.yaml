---
# Demo-sized Central for the 3-node tallgeese lab (ACS 5.0).
# CPU *requests* are the constraint on this cluster, not usage, so requests are
# kept well below the documented defaults (Central 1.5 / Central DB 4 / StackRox
# Scanner 3 / Scanner V4 6.5 cores). Total Central-side requests here: ~1.4 CPU.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  central:
    exposure:
      route:
        enabled: true
    resources:
      requests:
        cpu: "500m"       # default 1.5
        memory: "2Gi"     # default 4Gi
      limits:
        cpu: "2"
        memory: "4Gi"
    # Central DB (PostgreSQL). Note: spec.central.persistence is an unused
    # legacy field since 4.6; storage is configured here under db.
    db:
      resources:
        requests:
          cpu: "500m"     # default 4 cores
          memory: "2Gi"   # default 8Gi
        limits:
          cpu: "2"
          memory: "4Gi"
      persistence:
        persistentVolumeClaim:
          claimName: central-db
          size: "100Gi"   # thin-provisioned LVM
  scanner:
    # StackRox Scanner: deprecated but still required on the Central cluster.
    analyzer:
      resources:
        requests:
          cpu: "200m"     # default 1 per replica (3 replicas)
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      scaling:
        autoScaling: "Disabled"
        replicas: 1
    scannerComponent: "Enabled"
  # Scanner V4 disabled to save ~6.5 cores of requests (indexer/matcher/db).
  scannerV4:
    scannerComponent: "Disabled"
