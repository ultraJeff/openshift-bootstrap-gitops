---
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  labels:
    name: rhacs-operator
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator-operatorgroup
  namespace: rhacs-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
spec:
  # Pinned to a versioned channel so a new major (e.g. 5.1/6.0) isn't picked up
  # unannounced. Bump deliberately.
  channel: rhacs-5.0
  installPlanApproval: Automatic
  name: rhacs-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
