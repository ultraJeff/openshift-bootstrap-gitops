---
# Demo-sized SecuredCluster for the local (tallgeese, 3-node) cluster, ACS 5.0.
# Requires the `cluster-registration-secret` (CRS) in stackrox, generated by
# Central and applied manually (not in Git).
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: local-cluster
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterName: "tallgeese"
  centralEndpoint: "central.stackrox.svc:443"  # same-cluster Central
  admissionControl:
    # 5.0 fields (listenOn*/timeoutSeconds/contactImageScanners are deprecated).
    enforcement: Enabled          # only blocks policies set to "Inform and enforce"
    bypass: BreakGlassAnnotation  # emergency bypass via annotation (audited)
    failurePolicy: Ignore         # fail-open if the admission controller is slow/down
    replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "100Mi"
      limits:
        cpu: "200m"
        memory: "500Mi"
  perNode:
    collector:
      collection: "CORE_BPF"      # current default; EBPF is legacy
      imageFlavor: "Regular"
      resources:
        requests:
          cpu: "50m"
          memory: "320Mi"
        limits:
          cpu: "200m"
          memory: "1Gi"
    taintToleration: "TolerateTaints"
  sensor:
    resources:
      requests:
        cpu: "200m"               # default 2 cores
        memory: "500Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  # Use Central's scanner instead of a secured-cluster scanner.
  scanner:
    scannerComponent: "Disabled"
