apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: acs-configs

resources:
- acs-operator.yaml
- stackrox-namespace.yaml
- acs-central.yaml
# SecuredCluster requires the `cluster-registration-secret` (CRS) in stackrox,
# generated by Central and applied manually (contains secrets; not in Git).
- acs-secured-cluster.yaml

commonLabels:
  config.openshift.io/component: acs
  config.openshift.io/managed-by: gitops
