kind: ConfigMap
apiVersion: v1
metadata:
  name: rhdh-dynamic-plugins
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  dynamic-plugins.yaml: |
    includes:
    - dynamic-plugins.default.yaml
    plugins:
      # RHDH 2.1: bundled ./dynamic-plugins/dist wrappers are removed. Supported plugins
      # come from registry.access.redhat.com (tag inherited from the shipped defaults),
      # community plugins from ghcr.io (bs_1.54.9 builds). Frontend plugins use the New
      # Frontend System and auto-register their extensions; customize via app.extensions.
      # Authentication providers (no longer built in)
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-auth-backend-module-oidc-provider:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-auth-backend-module-github-provider:{{inherit}}
        enabled: true
      # GitHub scaffolder actions (publish:github)
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-scaffolder-backend-module-github:{{inherit}}
        enabled: true
      # Catalog and GitHub plugins
      - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-catalog-backend-module-keycloak:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-catalog-backend-module-github:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-catalog-backend-module-github-org:{{inherit}}
        enabled: true
      # Kubernetes plugins
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-kubernetes-backend:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-kubernetes:{{inherit}}
        enabled: true
      # ArgoCD plugins (OCI community)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.54.9__1.7.2'
        enabled: true
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.54.9__3.1.3'
        enabled: true
      # RBAC plugin
      - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-rbac:{{inherit}}
        enabled: true
      # Topology plugin
      - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-topology:{{inherit}}
        enabled: true
      # Tekton CI plugin (OCI)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.54.9__4.0.5!backstage-community-plugin-tekton'
        enabled: true
      # ArgoCD scaffolder action (Roadie)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.54.9__1.9.0'
        enabled: true
      # Scaffolder utils (OCI)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-module-utils:bs_1.54.9__4.2.1'
        enabled: true
      # Scaffolder HTTP request action
      - package: oci://registry.access.redhat.com/rhdh/roadiehq-scaffolder-backend-module-http-request:{{inherit}}
        enabled: true
      # Orchestrator plugins (GA in 2.1)
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator-backend:{{inherit}}
        enabled: true
        pluginConfig:
          orchestrator:
            dataIndexService:
              url: http://sonataflow-platform-data-index-service.sonataflow-infra
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator-form-widgets:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-scaffolder-backend-module-orchestrator:{{inherit}}
        enabled: true
        pluginConfig:
          orchestrator:
            dataIndexService:
              url: http://sonataflow-platform-data-index-service.sonataflow-infra
      # MTA plugins — no RHDH 2.1 (bs_1.54.9) build published; disabled until one exists
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-backstage-plugin-mta-frontend:bs_1.49.4__0.4.2'
        enabled: false
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-backstage-plugin-mta-backend:bs_1.49.4__0.5.3'
        enabled: false
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-backstage-plugin-catalog-backend-module-mta-entity-provider:bs_1.49.4__0.4.1'
        enabled: false
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-backstage-plugin-scaffolder-backend-module-mta:bs_1.49.4__0.5.1'
        enabled: false
      # GitHub Issues plugin (OCI)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-github-issues:bs_1.54.9__1.4.0'
        enabled: true
      # GitHub Pull Requests plugin (OCI)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-github-pull-requests:bs_1.54.9__3.9.0'
        enabled: true
      # Quay plugin (OCI)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay:bs_1.54.9__1.38.3'
        enabled: true
      # Nexus Repository Manager plugin (OCI)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-nexus-repository-manager:bs_1.54.9__1.27.4'
        enabled: true
      # Ansible plugins (OCI from registry.redhat.io)
      # NOTE: automation-portal 2.2/2.3 frontends are Old Frontend System builds (Backstage 1.49.4);
      # RHDH 2.1 removed OFS, so the Ansible page/field extensions may not render. Kept as-is.
      - package: 'oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.2!ansible-plugin-backstage-rhaap'
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              ansible.plugin-backstage-rhaap:
                appIcons:
                  - importName: AnsibleLogo
                    name: AnsibleLogo
                dynamicRoutes:
                  - importName: AnsiblePage
                    menuItem:
                      icon: AnsibleLogo
                      text: Ansible
                    path: /ansible
      - package: 'oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.2!ansible-plugin-backstage-self-service'
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              ansible.plugin-backstage-self-service:
                scaffolderFieldExtensions:
                  - importName: AAPTokenFieldExtension
                  - importName: AAPResourcePickerExtension
      - package: 'oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.2!ansible-backstage-plugin-catalog-backend-module-rhaap'
        disabled: false
        pluginConfig: {}
      - package: 'oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.2!ansible-backstage-plugin-auth-backend-module-rhaap-provider'
        disabled: true
      - package: 'oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.2!ansible-plugin-scaffolder-backend-module-backstage-rhaap'
        disabled: false
        pluginConfig:
          dynamicPlugins:
            backend:
              ansible.plugin-scaffolder-backend-module-backstage-rhaap:
      # Notifications plugins (notifications are Technology Preview, pinned by digest)
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-notifications@sha256:a7072bf6774d2ccea11e0f4e023b2f3cc3e54afc3bf9d1bf9f73187a41d628b2
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-signals:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-notifications-backend@sha256:24b0d871a4c110ad3edfd514d6bc95b4bc6a90529b22a3225171abcdb7af1bd6
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-signals-backend:{{inherit}}
        enabled: true
