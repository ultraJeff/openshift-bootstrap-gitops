apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: developer-hub-configs

resources:
- namespace.yaml
- rhdh-operator.yaml
- dynamic-plugins.yaml
- dynamic-plugins-root-pvc.yaml
- app-config-production.yaml
- rbac-policies.yaml
- rhdh-instance.yaml
- console-link.yaml
- kubernetes-rbac.yaml
- aap-credentials-eso.yaml
- argocd-credentials-eso.yaml
- keycloak-credentials-eso.yaml
- rhdh-backend-credentials-eso.yaml
- lightspeed-credentials-eso.yaml
- registry-auth-eso.yaml

commonLabels:
  config.openshift.io/component: developer-hub
  config.openshift.io/managed-by: gitops
