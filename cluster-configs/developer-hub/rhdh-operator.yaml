---
apiVersion: v1
kind: Namespace
metadata:
  name: rhdh-operator
  labels:
    name: rhdh-operator
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhdh-operator-operatorgroup
  namespace: rhdh-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhdh
  namespace: rhdh-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # fast-2.1: RHDH 2.1.x (Backstage 1.54.9). 2.y releases ship only to versioned
  # fast-X.Y channels; switch channels manually for each y-stream upgrade.
  channel: fast-2.1
  # Manual: y-stream upgrades (e.g. 1.10 -> 2.1) need a DB backup window before approval.
  installPlanApproval: Manual
  name: rhdh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
