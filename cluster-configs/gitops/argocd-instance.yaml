---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  kustomizeBuildOptions: "--enable-helm"
  # Custom health checks - treat Pending PVCs (WaitForFirstConsumer) as Healthy
  resourceHealthChecks:
    - group: ""
      kind: PersistentVolumeClaim
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.phase ~= nil then
            if obj.status.phase == "Pending" then
              -- WaitForFirstConsumer PVCs stay Pending until consumed - that's OK
              hs.status = "Healthy"
              hs.message = "PVC is Pending (WaitForFirstConsumer)"
            elseif obj.status.phase == "Bound" then
              hs.status = "Healthy"
              hs.message = "PVC is Bound"
            else
              hs.status = "Degraded"
              hs.message = "PVC is " .. obj.status.phase
            end
          end
        end
        return hs
  sourceNamespaces:
    - a-project
  applicationSet:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  controller:
    processors: {}
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi
    sharding: {}
  grafana:
    enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
    route:
      enabled: false
  ha:
    enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  initialSSHKnownHosts: {}
  monitoring:
    enabled: false
  notifications:
    enabled: false
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  rbac:
    defaultPolicy: ""
    policy: |
      g, openshift-admins, role:admin
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, admin, role:admin
      g, developer-hub, role:admin
    scopes: '[groups, preferred_username]'
  extraConfig:
    accounts.admin: 'apiKey, login'
    accounts.developer-hub: 'apiKey, login'
    accounts.developer-hub.password: '$2y$10$e7xeIzQlbcJXHOgYVKQ7W.ghGLAZgHNUrzIC7oqdHsS2Sx7A9vsju' # notsecret - bcrypt hash
    oidc.config: |
      name: Keycloak
      issuer: https://sso.ultra.lab/realms/openshift
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  repo:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
  resourceExclusions: |
    - apiGroups:
      - tekton.dev
      - triggers.tekton.dev
      - resolution.tekton.dev
      - pipelinesascode.tekton.dev
      - operator.tekton.dev
      clusters:
      - '*'
      kinds:
      - '*'
    - apiGroups:
      - components.platform.opendatahub.io
      - services.platform.opendatahub.io
      - serving.kserve.io
      - generators.external-secrets.io
      - policies.kyverno.io
      - kyverno.io
      - kafka.strimzi.io
      - k8s.ovn.org
      - metal3.io
      - perses.dev
      clusters:
      - '*'
      kinds:
      - '*'
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi
    route:
      enabled: true
    service:
      type: ""
  sso:
    provider: ""
  tls:
    ca: {}
