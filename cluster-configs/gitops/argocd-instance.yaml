---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  kustomizeBuildOptions: "--enable-helm"
  # Custom health checks - treat Pending PVCs (WaitForFirstConsumer) as Healthy
  resourceHealthChecks:
    - group: ""
      kind: PersistentVolumeClaim
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.phase ~= nil then
            if obj.status.phase == "Pending" then
              -- WaitForFirstConsumer PVCs stay Pending until consumed - that's OK
              hs.status = "Healthy"
              hs.message = "PVC is Pending (WaitForFirstConsumer)"
            elseif obj.status.phase == "Bound" then
              hs.status = "Healthy"
              hs.message = "PVC is Bound"
            else
              hs.status = "Degraded"
              hs.message = "PVC is " .. obj.status.phase
            end
          end
        end
        return hs
  sourceNamespaces:
    - a-project
  applicationSet:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  controller:
    processors: {}
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi
    sharding: {}
  grafana:
    enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
    route:
      enabled: false
  ha:
