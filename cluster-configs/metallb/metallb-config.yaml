---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ultra-lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.8.80-192.168.8.99
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ultra-lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - ultra-lab-pool
