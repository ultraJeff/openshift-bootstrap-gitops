---
# Red Hat Connectivity Link (RHCL) and its dependency operators.
#
# RHCL lives in its own namespace so its Manual approval only gates
# the RHCL operator family. In openshift-operators, OLM bundled every
# subscription into one InstallPlan, so this Manual setting froze
# upgrades for every other operator in that namespace.
#
# rhcl-operator requires exact dependency versions (authorino 1.4.3,
# dns 1.4.2, limitador 1.4.2 for rhcl 1.4.3). The dependencies are
# subscribed explicitly so they are tracked in git instead of being
# generated by OLM. When approving an RHCL upgrade, OLM moves the
# dependencies to the versions the new RHCL requires.
#
# Operands (Kuadrant CR in kuadrant-system, AuthPolicies,
# TokenRateLimitPolicies) are not managed here.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-connectivity-link
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-connectivity-link
  namespace: openshift-connectivity-link
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-connectivity-link
spec:
  channel: stable
  installPlanApproval: Manual
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: rhcl-operator.v1.4.3
  # The default 300Mi limit OOMKills the operator during its initial
  # cluster-wide cache sync on this cluster.
  config:
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: authorino-operator
  namespace: openshift-connectivity-link
spec:
  channel: stable
  installPlanApproval: Manual
  name: authorino-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: authorino-operator.v1.4.3
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: dns-operator
  namespace: openshift-connectivity-link
spec:
  channel: stable
  installPlanApproval: Manual
  name: dns-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: dns-operator.v1.4.2
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: limitador-operator
  namespace: openshift-connectivity-link
spec:
  channel: stable
  installPlanApproval: Manual
  name: limitador-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: limitador-operator.v1.4.2
