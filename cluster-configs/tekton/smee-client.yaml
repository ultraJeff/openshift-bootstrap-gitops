---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smee-client
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smee-client
  template:
    metadata:
      labels:
        app: smee-client
    spec:
      containers:
        - name: smee-client
          image: registry.access.redhat.com/ubi9/nodejs-22:latest
          command:
            - /bin/sh
            - -c
            - npx smee-client --url $(SMEE_URL) --target http://pipelines-as-code-controller.openshift-pipelines.svc.cluster.local:8080 --path /
          env:
            - name: SMEE_URL
              valueFrom:
                secretKeyRef:
                  name: smee-credentials
                  key: url
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
